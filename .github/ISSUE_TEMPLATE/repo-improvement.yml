name: Repository improvement
description: Suggest a README, docs, verification, or repository-health improvement
title: "[repo] "
labels: ["repo-health", "documentation"]
body:
  - type: textarea
    id: improvement
    attributes:
      label: Improvement
      description: What should be improved?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Explain the user, maintainer, security, or verification impact.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Suggested verification
      description: What command, checklist, screenshot, or review would prove the improvement works?
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I did not include secrets, tokens, cookies, private paths, private URLs, browser profiles, private logs, or account data.
          required: true
